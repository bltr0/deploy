name: Deploy Docker Compose App
description: Rsync the calling repo to the host, then build and restart services with docker compose
inputs:
  host:
    required: true
    description: "SSH host address"
  username:
    required: true
    description: "SSH username"
  key:
    required: true
    description: "SSH private key"
  project_dir:
    required: true
    description: "Absolute path to project directory on host"
  compose_file:
    required: false
    default: "docker-compose.yml"
    description: "Path to the compose file relative to project_dir"
  migration_service:
    required: false
    default: ""
    description: "Service name to run migrations on (leave empty to skip)"
  migration_command:
    required: false
    default: ""
    description: "Full migration command to run (e.g. 'npx prisma migrate deploy')"
  command_timeout:
    required: false
    default: "30m"
    description: "Time limit per SSH attempt (e.g. 10m, 30m); 3 attempts"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7.0.1

    - name: Validate inputs
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project_dir }}
      run: |
        # rsync runs with --delete: refuse anything that could wipe the wrong tree
        case "$PROJECT_DIR" in
          /*) ;;
          *) echo "project_dir must be an absolute path"; exit 1 ;;
        esac
        if [ "$PROJECT_DIR" = "/" ] || [ "$(echo "$PROJECT_DIR" | tr -s / | sed 's#/$##' | awk -F/ '{print NF-1}')" -lt 2 ]; then
          echo "project_dir '$PROJECT_DIR' is too shallow; refusing to rsync --delete into it"
          exit 1
        fi

    - name: Deploy via rsync
      uses: burnett01/rsync-deployments@9.0.1
      with:
        # -rlz instead of -a: don't try to preserve times/perms/owner, which fails (code 23)
        # on files the deploy user doesn't own. --checksum makes mtimes unnecessary anyway.
        switches: -rlvz --delete --delete-after --checksum --omit-dir-times --exclude=.git --exclude=node_modules --exclude=dist --exclude=.env
        path: ./
        remote_path: ${{ inputs.project_dir }}
        remote_host: ${{ inputs.host }}
        remote_user: ${{ inputs.username }}
        remote_key: ${{ inputs.key }}

    # Plain SSH with a limit per attempt and retries ; the limit is
    # command_timeout, since a compose build can legitimately take long.
    - name: Build and start services
      shell: bash
      env:
        SSH_HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.username }}
        SSH_KEY: ${{ inputs.key }}
        LIMIT: ${{ inputs.command_timeout }}
        SSH_ENVS: PROJECT_DIR COMPOSE_FILE_PATH MIGRATION_SERVICE MIGRATION_COMMAND
        PROJECT_DIR: ${{ inputs.project_dir }}
        COMPOSE_FILE_PATH: ${{ inputs.compose_file }}
        MIGRATION_SERVICE: ${{ inputs.migration_service }}
        MIGRATION_COMMAND: ${{ inputs.migration_command }}
      run: |
        cat > "$RUNNER_TEMP/remote.sh" <<'REMOTE'

          cd "$PROJECT_DIR"
          rm -rf .git

          if ! docker compose -f "$COMPOSE_FILE_PATH" build; then
            echo "Build failed; running containers were left unchanged"
            exit 1
          fi

          docker compose -f "$COMPOSE_FILE_PATH" up -d --remove-orphans

          if [ -n "$MIGRATION_SERVICE" ] && [ -n "$MIGRATION_COMMAND" ]; then
            echo "Waiting for $MIGRATION_SERVICE to be healthy..."
            # `docker compose wait` blocks until the container EXITS, so poll health instead
            CID=$(docker compose -f "$COMPOSE_FILE_PATH" ps -q "$MIGRATION_SERVICE")
            [ -n "$CID" ] || { echo "Service $MIGRATION_SERVICE has no container"; exit 1; }
            for i in $(seq 1 60); do
              STATUS=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CID")
              case "$STATUS" in
                healthy|running) break ;;
                unhealthy|exited|dead) echo "$MIGRATION_SERVICE is $STATUS"; docker logs --tail 50 "$CID"; exit 1 ;;
              esac
              [ "$i" -eq 60 ] && { echo "Timed out waiting for $MIGRATION_SERVICE (status: $STATUS)"; exit 1; }
              sleep 2
            done
            # MIGRATION_COMMAND is intentionally word-split into argv
            docker compose -f "$COMPOSE_FILE_PATH" exec -T "$MIGRATION_SERVICE" $MIGRATION_COMMAND
          else
            echo "Skipping migrations"
          fi

          docker compose -f "$COMPOSE_FILE_PATH" ps
          docker image prune -af || echo "Image prune failed (non-fatal)"
        REMOTE
        # Plain SSH, a time limit per attempt, 3 attempts. Only a timeout or a lost connection
        # is retried: a failure of the script itself stops at once. The script must be safe to run twice.
        umask 077
        KEY_FILE="$RUNNER_TEMP/deploy_key"; PAYLOAD="$RUNNER_TEMP/remote_payload.sh"
        trap 'rm -f "$KEY_FILE" "$PAYLOAD"' EXIT
        printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
        { echo 'set -eu'; for v in $SSH_ENVS; do printf 'export %s=%q\n' "$v" "${!v-}"; done; cat "$RUNNER_TEMP/remote.sh"; } > "$PAYLOAD"
        for i in 1 2 3; do
          echo "::group::Attempt $i/3 (limit $LIMIT)"
          rc=0
          timeout --kill-after=10 "$LIMIT" ssh -i "$KEY_FILE" -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$SSH_USER@$SSH_HOST" 'bash -s' < "$PAYLOAD" || rc=$?
          echo "::endgroup::"
          case $rc in
            0) exit 0 ;;
            124|137|255) echo "::warning::Attempt $i/3 timed out or lost the connection (exit $rc)" ;;
            *) echo "::error::Remote script failed (exit $rc)"; exit "$rc" ;;
          esac
        done
        echo "::error::No attempt finished within $LIMIT (3 tries): giving up"; exit 1

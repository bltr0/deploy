name: Deploy Docker App
description: Build image on GH Actions, transfer to VPS via SSH, and restart container
inputs:
  host:
    required: true
    description: "SSH host address"
  username:
    required: true
    description: "SSH username"
  key:
    required: true
    description: "SSH private key"
  image_name:
    required: true
    description: "Docker image name"
  container_name:
    required: true
    description: "Docker container name to run"
  project_dir:
    required: true
    description: "Absolute path to project directory on host (must contain Dockerfile)"
  docker_run_flags:
    required: false
    default: ""
    description: "Extra flags passed to docker run (e.g. '-p 127.0.0.1:3000:3000 --env-file .env')"
  migration_command:
    required: false
    default: ""
    description: "Full migration command to run before starting container (e.g. 'npx prisma migrate deploy')"
  docker_host:
    required: false
    default: "unix:///run/user/1000/docker.sock"
    description: "DOCKER_HOST on the VPS (default: rootless Docker for uid 1000)"
  attempt_timeout:
    required: false
    default: "2m"
    description: "Time limit per SSH attempt for starting the container (3 attempts)"
  startup_check_seconds:
    required: false
    default: "10"
    description: "Seconds to wait before checking the new container is still running (rollback otherwise)"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7.0.1
    - uses: docker/setup-buildx-action@v4.4.1

    - name: Build image
      shell: bash
      env:
        IMAGE: ${{ inputs.image_name }}
      run: |
        docker build --pull -t "$IMAGE:latest" .

    - name: Transfer image to VPS
      shell: bash
      env:
        SSH_KEY: ${{ inputs.key }}
        SSH_USER: ${{ inputs.username }}
        SSH_HOST: ${{ inputs.host }}
        IMAGE: ${{ inputs.image_name }}
        REMOTE_DOCKER_HOST: ${{ inputs.docker_host }}
      run: |
        KEY_FILE="$RUNNER_TEMP/deploy_key"
        trap 'rm -f "$KEY_FILE"' EXIT
        umask 077
        printf '%s\n' "$SSH_KEY" > "$KEY_FILE"

        RUNTIME_DIR=$(dirname "${REMOTE_DOCKER_HOST#unix://}")

        # Keep the currently running image as :previous so we can roll back, then load the new one
        docker save "$IMAGE:latest" \
          | gzip \
          | ssh \
              -i "$KEY_FILE" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
              -o Compression=no \
              "$SSH_USER@$SSH_HOST" \
              "export DOCKER_HOST='$REMOTE_DOCKER_HOST' XDG_RUNTIME_DIR='$RUNTIME_DIR' && \
               (docker image inspect '$IMAGE:latest' >/dev/null 2>&1 && docker tag '$IMAGE:latest' '$IMAGE:previous' || true) && \
               gunzip | docker load"

    # Plain SSH with a limit per attempt and retries : appleboy/ssh-action
    # could hang for its whole 10 min command timeout.
    - name: Start container
      shell: bash
      env:
        SSH_HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.username }}
        SSH_KEY: ${{ inputs.key }}
        LIMIT: ${{ inputs.attempt_timeout }}
        SSH_ENVS: IMAGE CONTAINER RUN_FLAGS MIGRATION_COMMAND REMOTE_DOCKER_HOST STARTUP_CHECK
        IMAGE: ${{ inputs.image_name }}
        CONTAINER: ${{ inputs.container_name }}
        RUN_FLAGS: ${{ inputs.docker_run_flags }}
        MIGRATION_COMMAND: ${{ inputs.migration_command }}
        REMOTE_DOCKER_HOST: ${{ inputs.docker_host }}
        STARTUP_CHECK: ${{ inputs.startup_check_seconds }}
      run: |
        cat > "$RUNNER_TEMP/remote.sh" <<'REMOTE'
          export DOCKER_HOST="$REMOTE_DOCKER_HOST"
          export XDG_RUNTIME_DIR="$(dirname "${REMOTE_DOCKER_HOST#unix://}")"

          # an attempt cut short may still be running: wait for it rather than overlap
          exec 9>"/tmp/deploy-$CONTAINER.lock"
          flock -w 90 9 || { echo "Another deploy of $CONTAINER is still running"; exit 1; }

          # RUN_FLAGS / MIGRATION_COMMAND are intentionally word-split into argv

          # Migrate while the old container still serves traffic: a failed migration aborts the deploy
          if [ -n "$MIGRATION_COMMAND" ]; then
            echo "Running migrations..."
            docker run --rm $RUN_FLAGS "$IMAGE:latest" $MIGRATION_COMMAND
          fi

          start() {
            docker stop "$CONTAINER" >/dev/null 2>&1 || true
            docker rm   "$CONTAINER" >/dev/null 2>&1 || true
            docker run -d --name "$CONTAINER" --restart=unless-stopped $RUN_FLAGS "$1"
          }

          start "$IMAGE:latest"

          sleep "$STARTUP_CHECK"
          if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" != "true" ] \
             || [ "$(docker inspect -f '{{.RestartCount}}' "$CONTAINER")" -gt 0 ]; then
            echo "New container failed to stay up:"
            docker logs --tail 50 "$CONTAINER" || true
            if docker image inspect "$IMAGE:previous" >/dev/null 2>&1; then
              echo "Rolling back to $IMAGE:previous"
              start "$IMAGE:previous"
            fi
            exit 1
          fi

          docker image prune -f || echo "Image prune failed (non-fatal)"
        REMOTE
        # Plain SSH, a time limit per attempt, 3 attempts. Only a timeout or a lost connection
        # is retried: a failure of the script itself stops at once. The script must be safe to run twice.
        umask 077
        KEY_FILE="$RUNNER_TEMP/deploy_key"; PAYLOAD="$RUNNER_TEMP/remote_payload.sh"
        trap 'rm -f "$KEY_FILE" "$PAYLOAD"' EXIT
        printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
        { echo 'set -eu'; for v in $SSH_ENVS; do printf 'export %s=%q\n' "$v" "${!v-}"; done; cat "$RUNNER_TEMP/remote.sh"; } > "$PAYLOAD"
        for i in 1 2 3; do
          echo "::group::Attempt $i/3 (limit $LIMIT)"
          rc=0
          timeout --kill-after=10 "$LIMIT" ssh -i "$KEY_FILE" -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$SSH_USER@$SSH_HOST" 'bash -s' < "$PAYLOAD" || rc=$?
          echo "::endgroup::"
          case $rc in
            0) exit 0 ;;
            124|137|255) echo "::warning::Attempt $i/3 timed out or lost the connection (exit $rc)" ;;
            *) echo "::error::Remote script failed (exit $rc)"; exit "$rc" ;;
          esac
        done
        echo "::error::No attempt finished within $LIMIT (3 tries): giving up"; exit 1
